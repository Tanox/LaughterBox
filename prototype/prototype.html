<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaughterBox - 笑话大集合</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-light: #fafafa;
            --bg-dark: #030303;
            --card-light: #ffffff;
            --card-dark: #171717;
            --text-light: #171717;
            --text-dark: #fafafa;
            --border-light: rgba(229, 229, 229, 0.5);
            --border-dark: rgba(38, 38, 38, 0.5);
            --shadow-light: 0 8px 30px rgba(0, 0, 0, 0.04);
            --shadow-dark: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: var(--bg-light);
            color: var(--text-light);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
            user-select: none;
        }

        body.dark {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border-light);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
        }

        body.dark header {
            border-bottom: 1px solid var(--border-dark);
            background: rgba(3, 3, 3, 0.9);
        }

        .header-content {
            max-width: 72rem;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 1rem;
        }

        @media (min-width: 768px) {
            .header-content {
                padding: 0.75rem 2rem;
            }
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-logo svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        @media (min-width: 768px) {
            .brand-logo svg {
                width: 1.5rem;
                height: 1.5rem;
            }
        }

        .brand-logo h1 {
            font-size: 1.125rem;
            font-weight: 600;
        }

        @media (min-width: 768px) {
            .brand-logo h1 {
                font-size: 1.25rem;
            }
        }

        .theme-toggle {
            width: 2.25rem;
            height: 2.25rem;
            border: 1px solid var(--border-light);
            border-radius: 0.375rem;
            background: var(--card-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }

        body.dark .theme-toggle {
            border: 1px solid var(--border-dark);
            background: var(--card-dark);
        }

        .theme-toggle:hover {
            background: #f5f5f5;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        body.dark .theme-toggle:hover {
            background: #262626;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .theme-toggle svg {
            width: 1rem;
            height: 1rem;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .sun-icon {
            transform: rotate(0deg);
            opacity: 1;
        }

        body.dark .sun-icon {
            transform: rotate(-90deg);
            opacity: 0;
        }

        .moon-icon {
            position: absolute;
            transform: rotate(90deg);
            opacity: 0;
        }

        body.dark .moon-icon {
            transform: rotate(0deg);
            opacity: 1;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            main {
                padding: 1.5rem 3rem;
            }
        }

        @media (min-width: 1024px) {
            main {
                padding: 1.5rem 6rem;
            }
        }

        .joke-viewer-container {
            position: relative;
            width: 100%;
            max-width: 48rem;
        }

        @media (min-width: 1024px) {
            .joke-viewer-container {
                max-width: 64rem;
            }
        }

        .joke-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 350px;
            border-radius: 1.5rem;
            background: var(--card-light);
            box-shadow: var(--shadow-light);
            padding: 2rem;
            cursor: grab;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        body.dark .joke-card {
            background: var(--card-dark);
            box-shadow: var(--shadow-dark);
        }

        .joke-card:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        body.dark .joke-card:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        @media (min-width: 640px) {
            .joke-card {
                padding: 3rem;
            }
        }

        @media (min-width: 768px) {
            .joke-card {
                min-height: 450px;
                padding: 4rem;
            }
        }

        .joke-card:active {
            cursor: grabbing;
        }

        .quote-decoration {
            position: absolute;
            opacity: 0.1;
        }

        body.dark .quote-decoration {
            opacity: 0.2;
        }

        .quote-decoration.top-left {
            top: 2rem;
            left: 2rem;
            transform: rotate(180deg);
        }

        .quote-decoration.bottom-right {
            bottom: 2rem;
            right: 2rem;
        }

        .quote-decoration svg {
            width: 3rem;
            height: 3rem;
        }

        .joke-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .joke-text {
            max-width: 90%;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 300;
            line-height: 1.6;
            letter-spacing: -0.025em;
            animation: fadeIn 0.4s ease;
        }

        @media (min-width: 640px) {
            .joke-text {
                font-size: 1.75rem;
                line-height: 1.7;
            }
        }

        @media (min-width: 768px) {
            .joke-text {
                font-size: 2rem;
                line-height: 1.8;
            }
        }

        @media (min-width: 1024px) {
            .joke-text {
                font-size: 2.25rem;
                line-height: 1.9;
            }
        }

        .joke-index-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            opacity: 0.3;
        }

        .joke-index-container span {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .index-line {
            width: 2rem;
            height: 1px;
            background: currentColor;
        }

        .nav-controls {
            margin-top: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
        }

        @media (min-width: 768px) {
            .nav-controls {
                margin-top: 3rem;
            }
        }

        .main-buttons {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-btn {
            border: none;
            background: var(--card-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: var(--shadow-light);
        }

        body.dark .nav-btn {
            background: var(--card-dark);
            box-shadow: var(--shadow-dark);
        }

        .nav-btn:hover {
            background: #f5f5f5;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        body.dark .nav-btn:hover {
            background: #262626;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        .nav-btn:active {
            transform: scale(0.92) translateY(0);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        body.dark .nav-btn:active {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .nav-btn.small {
            width: 3.5rem;
            height: 3.5rem;
        }

        .nav-btn.large {
            width: 4rem;
            height: 4rem;
        }

        @media (min-width: 768px) {
            .nav-btn.small {
                width: 4rem;
                height: 4rem;
            }
            .nav-btn.large {
                width: 5rem;
                height: 5rem;
            }
        }

        .nav-btn svg {
            width: 1.5rem;
            height: 1.5rem;
            transition: transform 0.2s ease;
        }

        .nav-btn:hover svg {
            transform: scale(1.1);
        }

        @media (min-width: 768px) {
            .nav-btn svg {
                width: 1.75rem;
                height: 1.75rem;
            }
        }

        .secondary-buttons {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .secondary-btn {
            width: 2.75rem;
            height: 2.75rem;
            border: none;
            background: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #a3a3a3;
            transition: color 0.2s ease, transform 0.2s ease, background 0.2s ease;
            position: relative;
        }

        .secondary-btn:hover {
            color: #525252;
            transform: scale(1.15);
            background: rgba(0, 0, 0, 0.04);
        }

        body.dark .secondary-btn:hover {
            color: #d4d4d4;
            background: rgba(255, 255, 255, 0.08);
        }

        .secondary-btn:active {
            transform: scale(0.9);
        }

        .secondary-btn svg {
            width: 1.35rem;
            height: 1.35rem;
            transition: transform 0.2s ease, fill 0.3s ease;
        }

        .secondary-btn.favorite.active {
            color: #ef4444;
        }

        .secondary-btn.favorite.active svg {
            fill: currentColor;
            animation: heartBeat 0.5s ease;
        }

        .secondary-btn.autoplay.active {
            color: #3b82f6;
        }

        .copied-toast {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #22c55e;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            pointer-events: none;
        }

        .copied-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(0.95); }
            75% { transform: scale(1.15); }
        }

        .joke-card.slide-left {
            animation: slideInLeft 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .joke-card.slide-right {
            animation: slideInRight 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .joke-card.random {
            animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .version-badge {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            opacity: 0.4;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <header>
            <div class="header-content">
                <div class="brand-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                        <path d="M5 3l2 4"/>

                <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">

                        <path d="M12 20v2"/>

                        <path d="M2 12h2"/>
                        <path d="M20 12h2"/>
                        <path d="m6.34 17.66-1.41 1.41"/>
                        <path d="m19.07 4.93-1.41 1.41"/>
                    </svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                    </svg>
                </button>
            </div>
        </header>

        <main>
            <div class="joke-viewer-container">
                <div class="joke-card" id="joke-card">
                    <div class="quote-decoration top-left">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/>
                        </svg>
                    </div>

                    <div class="joke-content">
                        <p class="joke-text" id="joke-text">笑是一种没有副作用的镇静剂。</p>
                        <div class="joke-index-container">
                            <div class="index-line"></div>
                            <span id="joke-index">001 / 124</span>
                            <div class="index-line"></div>
                        </div>
                    </div>

                    <div class="quote-decoration bottom-right">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/>
                        </svg>
                    </div>
                </div>

                <div class="nav-controls">
                    <div class="main-buttons">
                        <button class="nav-btn small" id="btn-prev" aria-label="上一个">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m15 18-6-6 6-6"/>
                            </svg>
                        </button>
                        <button class="nav-btn large" id="btn-random" aria-label="随机">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M16 3h5v5"/>
                                <path d="M4 20l7 7"/>
                                <path d="M21 16V8a2 2 0 0 0-2-2h-1"/>
                                <path d="M3 8v8a2 2 0 0 0 2 2h1"/>
                                <path d="m21 3-6 6"/>
                                <path d="M4 4l7 7"/>
                            </svg>
                        </button>
                        <button class="nav-btn small" id="btn-next" aria-label="下一个">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m9 18 6-6-6-6"/>
                            </svg>
                        </button>
                    </div>

                    <div class="secondary-buttons">
                        <button class="secondary-btn autoplay" id="btn-autoplay" aria-label="开始自动播放">
                            <svg class="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                                <rect x="6" y="4" width="4" height="16"/>
                                <rect x="14" y="4" width="4" height="16"/>
                            </svg>
                        </button>
                        <button class="secondary-btn favorite" id="btn-favorite" aria-label="收藏">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                            </svg>
                        </button>
                        <button class="secondary-btn" id="btn-copy" aria-label="复制">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                        </button>
                        <button class="secondary-btn" id="btn-share" aria-label="分享">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                        </button>
                    </div>

                    <div class="version-badge">v5.9.0</div>
                </div>
            </div>
        </main>
    </div>

    <div class="copied-toast" id="copied-toast">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5"/>
        </svg>
        已复制到剪贴板
    </div>

    <script>
        const jokes = [
            "青年问禅师：\"大师，我很爱我的女朋友，她也有很多优点，但是总有几个缺点让我非常讨厌，有什么方法能让她改变？\"禅师浅笑，答：\"方法很简单，不过若想我教你，你需先下山为我找一张只有正面没有背面的纸回来。\"青年略一沉吟，默默掏出一张人民币。",
            "父亲问我人生有什么追求？我回答金钱和美女，父亲凶狠地打了我的脸；我回答事业与爱情，父亲赞赏地摸了我的头。",
            "郑国人买鞋，宁可相信尺码也不相信自己的脚。后来他去买内裤，老板说：\"你怎么不拿个尺子来量？\"他说：\"不用，我有之前的内裤尺码。\"老板说：\"那你之前的内裤呢？\"他说：\"刚才买鞋的时候当尺子用了。\"",
            "儿子问：\"爸爸，为什么汽车的速度表上最高能到200公里，但是我们从来没开到过那么快？\"爸爸说：\"就像你数学书后面的答案，虽然都有，但你从来没全做对过。\"",
            "记者采访一位百岁老人：\"您长寿的秘诀是什么？\"老人说：\"保持呼吸，不要断气。\"",
            "一个人去买狗，问老板：\"这只狗聪明吗？\"老板说：\"当然聪明，它昨天还给我买报纸呢！\"那人说：\"真的吗？那我要了！\"第二天，那人回来找老板：\"你这狗根本不会买报纸！\"老板说：\"可是昨天它真的买了啊，你再问问它今天想买什么报纸？\"",
            "老师问小明：\"如果你有5个苹果，我拿走3个，还剩几个？\"小明说：\"还剩一个烂苹果。\"老师：\"为什么？\"小明：\"因为那5个苹果里本来就有一个是烂的。\"",
            "医生问病人：\"你失眠多久了？\"病人说：\"三个晚上了。\"医生：\"那你白天精神怎么样？\"病人：\"白天睡得特别香。\"",
            "一个人买西瓜，问老板：\"这西瓜甜吗？\"老板说：\"甜得像蜜一样！\"那人买了一个，回家切开一尝，一点都不甜，就回去找老板。老板说：\"你看，这西瓜长得多甜美的样子，怎么会不甜呢？肯定是你吃的方式不对。\"",
            "两个人在钓鱼，一个人突然说：\"这里的鱼真傻，都不上钩。\"另一个人说：\"不是鱼傻，是你放的鱼饵不对。\"那人说：\"我放的是巧克力啊，我自己都喜欢吃。\"",
            "快递员打电话：\"您好，您的快递到了，请问在家吗？\"我说：\"在，你放门口吧。\"快递员：\"不行，这个必须本人签收。\"我：\"那你等我一下，我正在开门。\"过了五分钟，快递员：\"您怎么还没出来？\"我：\"我家的门有点问题，正在修呢。\"快递员：\"那我明天再来吧。\"我：\"别，你等我，我已经从窗户爬出来了。\"",
            "老婆让我做饭，我问：\"做什么菜？\"老婆说：\"随便。\"我：\"那我做个西红柿炒鸡蛋？\"老婆：\"不想吃。\"我：\"那做个红烧肉？\"老婆：\"太油腻。\"我：\"那你说做什么？\"老婆：\"随便。\"",
            "考试前，小明对同桌说：\"等会儿考试的时候，你踢我一下，我就知道选A；踢两下，选B；踢三下，选C；踢四下，选D。\"考试开始了，小明感觉同桌一直在踢他，踢了几十下，小明急了，小声问：\"你到底踢够了没有？\"同桌说：\"我也不知道选哪个，就都踢了一遍。\"",
            "老婆说：\"我要减肥，从今天开始，晚上只吃水果。\"我说：\"好啊，我支持你。\"第一天晚上，老婆吃了一个西瓜、两个苹果、三个香蕉、四个橙子……第二天，老婆说：\"我觉得减肥还是应该从明天开始。\"",
            "一个人问路：\"请问，去医院怎么走？\"路人：\"你沿着这条路一直走，走到第一个十字路口右转，然后再走一会儿，看到一个垃圾桶，你就把垃圾扔了，然后继续走，看到一个红绿灯，你就等绿灯，然后过马路，再走一会儿，就到了。\"那人说：\"谢谢，不过我只是想问路，不是让你给我讲人生哲理。\"",
            "老虎抓住了一只兔子，准备吃了它。兔子说：\"老虎大哥，你不能吃我，我是一只聪明的兔子，我可以帮你做很多事情。\"老虎说：\"你能帮我做什么？\"兔子说：\"我可以帮你找食物，帮你放哨，还可以给你讲笑话。\"老虎说：\"那你先讲个笑话听听，如果好笑，我就不吃你。\"兔子说：\"从前有一只老虎，它抓住了一只兔子，然后让兔子讲笑话，兔子讲了一个笑话，老虎笑了，然后老虎就把兔子放了。\"老虎说：\"这不好笑。\"兔子说：\"那你等一下，我还有更好笑的。\"老虎说：\"不用了，我已经饱了。\"",
            "猫追老鼠，老鼠躲进了洞里。猫在洞门口等了很久，老鼠都不出来。猫想了一个办法，它在洞门口学狗叫：\"汪汪汪！\"老鼠想：\"狗来了，猫肯定会走的。\"于是老鼠就出来了。猫一把抓住老鼠，说：\"你看，学会一门外语多重要！\"",
            "大象和蚂蚁结婚了，可是没过多久，大象就死了。蚂蚁非常伤心，它一边哭一边说：\"亲爱的，你怎么这么早就走了，我下半辈子不用干别的了，就忙着埋你了。\"",
            "乌龟和兔子比赛跑步，兔子很快就跑到了前面，它回头一看，乌龟还在后面慢慢爬。兔子想：\"反正乌龟爬得慢，我先睡一会儿。\"兔子醒来一看，乌龟已经爬到终点了。兔子非常生气，它对乌龟说：\"你作弊！\"乌龟说：\"我没有作弊，是你自己睡着了。\"兔子说：\"那我们再比一次。\"乌龟说：\"好啊，不过这次得我选路线。\"乌龟选了一条有很多河的路线，兔子不会游泳，只能看着乌龟慢慢爬过去。",
            "猪对牛说：\"你每天都要干活，真辛苦。\"牛说：\"你每天都不用干活，真舒服。\"猪说：\"可是我很快就要被宰了。\"牛说：\"可是我能活很久。\"猪说：\"那我们换一下吧。\"牛说：\"好啊。\"于是猪开始每天干活，牛开始每天休息。过了一段时间，猪被宰了，牛也因为不干活被宰了。",
            "什么动物最容易摔倒？答案：狐狸，因为它很狡猾（脚滑）。",
            "什么动物最没有方向感？答案：麋鹿，因为它迷路（麋鹿）了。",
            "什么动物能贴在墙上？答案：海豹，因为它是海报（海豹）。",
            "什么动物最节俭？答案：蚕，因为它会结茧（节俭）。",
            "什么动物最懂礼貌？答案：长颈鹿，因为它总是（颈）点头。",
            "什么东西越洗越脏？答案：水。",
            "什么东西有头没有脚？答案：蒜，因为它有蒜头。",
            "什么东西越热越爱出来？答案：汗。",
            "什么东西没吃的时候是绿的，吃的时候是红的，吐出来是黑的？答案：西瓜。",
            "什么东西怕水不怕火？答案：冰块。",
            "一个人有一个木桶，木桶有一个漏洞，每次装水都会漏出去一部分。他的朋友说：\"你把漏洞补一下吧。\"他说：\"不用，我每次多装一点水就行了。\"结果他每次装水都比别人多花很多时间，而且最后装的水还是和别人一样多。",
            "一个人买了一面镜子，他每天都照镜子，觉得自己越来越丑。他的朋友说：\"你换一面镜子吧。\"他说：\"不用，我觉得这面镜子很真实。\"后来他才发现，原来这面镜子是哈哈镜。",
            "一个人拿着一个杯子去装水，装了一半就不装了。他的朋友说：\"你怎么不装满？\"他说：\"装满了就倒不出来了。\"朋友说：\"可是你装这么少，也不够用啊。\"他说：\"没关系，我可以再去装。\"",
            "一个人在河边看到一块漂亮的石头，他把石头捡起来，带回家。过了几天，他觉得这块石头也没那么漂亮了，就把它扔了。又过了几天，他在河边又看到一块漂亮的石头，他又捡起来，带回家，然后又扔了。后来他才明白，原来最漂亮的石头是他第一次捡到的那块。",
            "一个人种了一棵树，他每天都给树浇水、施肥，希望树能快点长大。过了几年，树终于长大了，他却把树砍了，因为他觉得树挡住了他的阳光。",
            "儿子问爸爸：\"爸爸，为什么你的头发都白了？\"爸爸说：\"因为你不听话，我操心操的。\"儿子说：\"那爷爷的头发怎么全白了？\"爸爸：\"……\"",
            "女儿问妈妈：\"妈妈，为什么你每天都要化妆？\"妈妈说：\"因为妈妈想变得漂亮一点。\"女儿说：\"可是你化了妆也没漂亮多少啊。\"",
            "爸爸对儿子说：\"你要好好学习，将来才能有出息。\"儿子说：\"爸爸，你小时候好好学习了吗？\"爸爸说：\"当然了，爸爸小时候学习可好了。\"儿子说：\"那你现在怎么没出息？\"",
            "妈妈对女儿说：\"你要学会做家务，将来才能嫁个好人家。\"女儿说：\"妈妈，你会做家务吗？\"妈妈说：\"当然了，妈妈做家务可好了。\"女儿说：\"那你怎么嫁给爸爸了？\"",
            "爷爷对孙子说：\"你要珍惜现在的幸福生活，爷爷小时候可苦了。\"孙子说：\"爷爷，你小时候有电视看吗？\"爷爷说：\"没有，那时候连电都没有。\"孙子说：\"那你小时候有手机玩吗？\"爷爷说：\"没有，那时候连电话都没有。\"孙子说：\"那你小时候真可怜。\"",
            "老师问小明：\"小明，你为什么迟到？\"小明说：\"因为我在路上遇到了一个强盗。\"老师说：\"强盗抢了你什么？\"小明说：\"他抢了我的作业。\"",
            "同学问小红：\"小红，你为什么这次考试考得这么好？\"小红说：\"因为我复习了。\"同学说：\"那你复习了什么？\"小红说：\"我复习了考试题目。\"",
            "考试的时候，小明偷看同桌的答案，被老师发现了。老师说：\"小明，你为什么偷看同桌的答案？\"小明说：\"因为我想知道他是不是也不会做。\"",
            "老师问小明：\"小明，你的作业为什么没做？\"小明说：\"因为我家的狗把我的作业吃了。\"老师说：\"那你为什么不把狗带来？\"小明说：\"因为它今天消化不良。\"",
            "上课的时候，小明睡着了，老师把他叫醒。老师说：\"小明，你为什么上课睡觉？\"小明说：\"因为我昨晚没睡好。\"老师说：\"你昨晚为什么没睡好？\"小明说：\"因为我担心今天上课会睡着。\"",
            "面试官问求职者：\"你有什么缺点？\"求职者说：\"我的缺点就是诚实。\"面试官说：\"诚实不是缺点啊。\"求职者说：\"真的吗？谢谢你的夸奖！\"",
            "老板问员工：\"你为什么每天都迟到？\"员工说：\"因为我家的闹钟坏了。\"老板说：\"那你为什么不换一个闹钟？\"员工说：\"因为我每天都迟到，没时间去买。\"",
            "同事问小明：\"小明，你为什么每天都加班？\"小明说：\"因为我工作效率低。\"同事说：\"那你为什么不提高工作效率？\"小明说：\"因为我每天都加班，没时间提高。\"",
            "老板在会上说：\"我们公司的理念就是客户至上，员工至上。\"小明问：\"那客户和员工哪个更重要？\"老板说：\"当然是客户更重要。\"小明说：\"那为什么还说员工至上？\"老板说：\"因为员工是为客户服务的。\"",
            "小明问老板：\"老板，我什么时候能加薪？\"老板说：\"等你工作满一年。\"小明说：\"可是我已经工作满一年了。\"老板说：\"那等你工作满两年。\"",
            "爱因斯坦的一位朋友问他：\"你为什么总是穿得这么随便？\"爱因斯坦说：\"反正这里的人都认识我。\"后来爱因斯坦成了名人，他还是穿得这么随便。他的朋友又问他：\"你现在是名人了，为什么还穿得这么随便？\"爱因斯坦说：\"反正这里的人都不认识我。\"",
            "牛顿坐在苹果树下，一个苹果掉了下来，砸到了他的头上。牛顿想：\"为什么苹果会掉下来，而不是飞上去呢？\"后来他发现了万有引力定律。其实，苹果掉下来是因为它熟了。",
            "爱迪生发明电灯的时候，失败了很多次。他的朋友问他：\"你失败了这么多次，为什么还不放弃？\"爱迪生说：\"我没有失败，我只是发现了很多种不能用来做电灯的材料。\"",
            "达芬奇画鸡蛋的时候，画了很多个鸡蛋。他的老师问他：\"你为什么总是画鸡蛋？\"达芬奇说：\"因为每个鸡蛋都不一样。\"其实，每个鸡蛋都差不多。",
            "贝多芬失聪后，还能继续创作音乐。有人问他：\"你失聪了，怎么还能创作音乐？\"贝多芬说：\"因为我能用心去听。\"",
            "一个人在河边钓鱼，钓了很久都没钓到一条鱼。他的朋友问他：\"你钓了这么久，怎么一条鱼都没钓到？\"他说：\"因为这里没有鱼。\"朋友说：\"那你为什么还在这里钓？\"他说：\"因为这里的风景好。\"",
            "一个人在图书馆看书，看了很久都没看进去。他的朋友问他：\"你看了这么久，看了什么？\"他说：\"我在看书的封面。\"朋友说：\"那你为什么不翻开看？\"他说：\"因为封面太好看了。\"",
            "一个人在跑步，跑了很久都没停下来。他的朋友问他：\"你跑了这么久，为什么不停下来？\"他说：\"因为我还没跑到终点。\"朋友说：\"那终点在哪里？\"他说：\"我也不知道。\"",
            "一个人在看电视，看了很久都没换台。他的朋友问他：\"你看了这么久，为什么不换台？\"他说：\"因为这个节目太好看了。\"朋友说：\"可是这个节目已经结束了。\"他说：\"那我在看广告。\"",
            "一个人在打电话，说了很久都没挂。他的朋友问他：\"你说了这么久，为什么不挂？\"他说：\"因为对方还没挂。\"朋友说：\"那对方为什么没挂？\"他说：\"因为我还没挂。\"",
            "青年问禅师：\"如何才能让别人喜欢我？\"禅师拿出一颗糖，剥了皮吃下去，然后把糖纸扔在地上。青年不解，问：\"这是何意？\"禅师说：\"你要像糖一样，给人甜蜜，而不是像糖纸一样，只剩包装。\"",
            "妻子问丈夫：\"你看我最近是不是胖了？\"丈夫说：\"没有啊，我觉得你很苗条。\"妻子说：\"真的吗？可是我刚才称体重，比以前重了两斤。\"丈夫说：\"那是因为你在我心里的分量重了。\"",
            "老师问学生：\"为什么我们要学历史？\"学生说：\"因为历史会重演。\"老师说：\"那我们更要好好学习历史，避免重演错误。\"学生说：\"可是我想看看历史能不能重演得更好玩一点。\"",
            "一个人去书店买书，问老板：\"有没有《如何快速赚钱》这本书？\"老板说：\"有啊，不过这本书在最里面的架子上。\"那人说：\"为什么放在那么里面？\"老板说：\"因为买这本书的人都想快速赚钱，不想走太远。\"",
            "医生对病人说：\"你要少吃盐，多运动。\"病人说：\"我已经很注意了，每天都吃很少的盐，而且每天都运动。\"医生说：\"那你为什么还这么胖？\"病人说：\"因为我吃的盐都在零食里，我的运动就是从沙发走到冰箱。\"",
            "两个人在聊天，一个人说：\"我最近在学瑜伽。\"另一个人说：\"瑜伽有什么好处？\"那个人说：\"瑜伽能让我变得更柔软。\"另一个人说：\"那你现在能摸到自己的脚趾吗？\"那个人说：\"不能，不过我现在能接受自己摸不到脚趾这个事实了。\"",
            "老板问员工：\"你觉得我们公司的产品怎么样？\"员工说：\"我觉得我们公司的产品就像我的女朋友一样。\"老板说：\"为什么这么说？\"员工说：\"因为虽然有很多缺点，但我还是很喜欢。\"",
            "妈妈问儿子：\"你为什么把玩具拆了？\"儿子说：\"我想看看它是怎么工作的。\"妈妈说：\"那你装回去了吗？\"儿子说：\"装回去了，不过多了几个零件。\"妈妈说：\"那怎么办？\"儿子说：\"没关系，下次拆别的玩具的时候再用。\"",
            "两个人在聊天，一个人说：\"今天的太阳真大。\"另一个人说：\"是啊，就像一个大火球。\"那个人说：\"不过这个大火球离我们太远了，不然我们就能烤火了。\"另一个人说：\"要是真离得那么近，我们早就被烤成肉干了。\"",
            "老师问学生：\"如果你有100万，你会怎么花？\"学生说：\"我会先买一个大房子，然后买一辆好车，然后去旅游。\"老师说：\"那你剩下的钱呢？\"学生说：\"剩下的钱？剩下的钱我会先欠着，等我有了更多的钱再还。\"",
            "一个人去餐厅吃饭，问服务员：\"你们这里有什么特色菜？\"服务员说：\"我们这里的特色菜是'红烧狮子头'。\"那个人说：\"那我要一个。\"服务员说：\"不过我们这里的狮子头不是真的狮子头，是猪肉做的。\"那个人说：\"没关系，我也不吃真的狮子头。\"",
            "爸爸问儿子：\"你长大了想做什么？\"儿子说：\"我长大了想当一个宇航员。\"爸爸说：\"当宇航员很好，不过你要好好学习。\"儿子说：\"我知道，我要好好学习数学，因为太空里有很多星星，我要数清楚。\"",
            "一个人在公园里散步，看到一个老人在钓鱼。他走过去问：\"大爷，您钓了多久了？\"老人说：\"我钓了三十年了。\"那个人说：\"那您一定很会钓鱼。\"老人说：\"是啊，我现在看到鱼就知道它会不会上钩。\"那个人说：\"那今天的鱼会上钩吗？\"老人说：\"今天的鱼都休息了。\"",
            "妻子问丈夫：\"你记得我们第一次见面是什么时候吗？\"丈夫说：\"当然记得，那是一个阳光明媚的下午，你穿着白色的连衣裙，看起来就像天使一样。\"妻子说：\"可是我们第一次见面是在晚上，而且我穿的是黑色的衣服。\"丈夫说：\"哦，是吗？那可能是我记错了，不过你在我心里永远是天使。\"",

            "一个人去买衣服，试了很多件都不满意。服务员问：\"您想要什么样的衣服？\"那个人说：\"我想要一件既便宜又好看，质量又好的衣服。\"服务员说：\"那您可能需要去梦里买。\"",

        ];

        let currentIndex = 0;
        let isDark = false;
        let isFavorite = false;
        let isAutoPlay = false;
        let autoPlayInterval = null;

        const jokeText = document.getElementById('joke-text');
        const jokeIndex = document.getElementById('joke-index');
        const jokeCard = document.getElementById('joke-card');
        const themeToggle = document.getElementById('theme-toggle');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnRandom = document.getElementById('btn-random');
        const btnFavorite = document.getElementById('btn-favorite');
        const btnCopy = document.getElementById('btn-copy');
        const btnShare = document.getElementById('btn-share');
        const btnAutoPlay = document.getElementById('btn-autoplay');
        const copiedToast = document.getElementById('copied-toast');
        const playIcon = document.querySelector('#btn-autoplay .play-icon');
        const pauseIcon = document.querySelector('#btn-autoplay .pause-icon');

        function updateJoke(animation = 'random') {
            jokeCard.classList.remove('slide-left', 'slide-right', 'random');
            void jokeCard.offsetWidth;

            switch(animation) {
                case 'left':
                    jokeCard.classList.add('slide-left');
                    break;
                case 'right':
                    jokeCard.classList.add('slide-right');
                    break;
                default:
                    jokeCard.classList.add('random');
            }

            jokeText.textContent = jokes[currentIndex];
            jokeIndex.textContent = `${String(currentIndex + 1).padStart(3, '0')} / ${String(jokes.length).padStart(3, '0')}`;
            isFavorite = false;
            btnFavorite.classList.remove('active');
        }

        function showCopiedToast() {
            copiedToast.classList.add('show');
            setTimeout(() => {
                copiedToast.classList.remove('show');
            }, 2000);
        }

        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            document.body.classList.toggle('dark', isDark);
        });

        btnPrev.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + jokes.length) % jokes.length;
            updateJoke('right');
        });

        btnNext.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % jokes.length;
            updateJoke('left');
        });

        btnRandom.addEventListener('click', () => {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * jokes.length);
            } while (newIndex === currentIndex && jokes.length > 1);
            currentIndex = newIndex;
            updateJoke('random');
        });

        btnFavorite.addEventListener('click', () => {
            isFavorite = !isFavorite;
            btnFavorite.classList.toggle('active', isFavorite);
        });

        btnCopy.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(jokes[currentIndex]);
                showCopiedToast();
            } catch (e) {
                console.error('Failed to copy', e);
            }
        });

        btnShare.addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'LaughterBox',
                        text: jokes[currentIndex],
                        url: window.location.href
                    });
                } catch (e) {
                    console.error('Failed to share', e);
                }
            } else {
                try {
                    await navigator.clipboard.writeText(jokes[currentIndex]);
                    showCopiedToast();
                } catch (e) {
                    console.error('Failed to copy', e);
                }
            }
        });

        btnAutoPlay.addEventListener('click', () => {
            isAutoPlay = !isAutoPlay;
            btnAutoPlay.classList.toggle('active', isAutoPlay);
            playIcon.style.display = isAutoPlay ? 'none' : 'inline';
            pauseIcon.style.display = isAutoPlay ? 'inline' : 'none';
            btnAutoPlay.setAttribute('aria-label', isAutoPlay ? '暂停自动播放' : '开始自动播放');

            if (isAutoPlay) {
                autoPlayInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % jokes.length;
                    updateJoke('left');
                }, 30000);
            } else {
                if (autoPlayInterval) {
                    clearInterval(autoPlayInterval);
                    autoPlayInterval = null;
                }
            }
        });

        let startX = 0;
        let isDragging = false;

        jokeCard.addEventListener('mousedown', (e) => {
            startX = e.clientX;
            isDragging = true;
        });

        jokeCard.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
        });

        jokeCard.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            const endX = e.clientX;
            const diffX = endX - startX;

            if (diffX < -50) {
                currentIndex = (currentIndex + 1) % jokes.length;
                updateJoke('left');
            } else if (diffX > 50) {
                currentIndex = (currentIndex - 1 + jokes.length) % jokes.length;
                updateJoke('right');
            }

            isDragging = false;
        });

        jokeCard.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        jokeCard.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
        });

        jokeCard.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            const endX = e.changedTouches[0].clientX;
            const diffX = endX - startX;

            if (diffX < -50) {
                currentIndex = (currentIndex + 1) % jokes.length;
                updateJoke('left');
            } else if (diffX > 50) {
                currentIndex = (currentIndex - 1 + jokes.length) % jokes.length;
                updateJoke('right');
            }

            isDragging = false;
        });

        updateJoke('random');
    </script>
