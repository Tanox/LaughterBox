<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaughterBox · 高保真原型 v6.0.0</title>
  <meta name="description" content="LaughterBox 高保真可交互原型" />

  <!-- Design Tokens (CSS variables) -->
  <style>
    :root {
      --bg: #fafafa;
      --fg: #171717;
      --card: #ffffff;
      --border: rgba(229, 229, 229, 0.55);
      --muted: #737373;
      --muted-fg: #f5f5f5;
      --shadow-card: 0 8px 30px rgb(0 0 0 / 0.04);
      --shadow-card-hover: 0 12px 40px rgb(0 0 0 / 0.08);
      --shadow-btn: 0 4px 14px rgb(0 0 0 / 0.08);
      --shadow-toast-success: 0 8px 24px rgb(34 197 94 / 0.4);
      --shadow-toast-error: 0 8px 24px rgb(239 68 68 / 0.4);
      --radius-lg: 1.5rem;
      --radius-xl: 2rem;
      --radius-full: 9999px;
      --ease: cubic-bezier(0.34, 1.56, 0.64, 1);
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --font-serif: 'Noto Serif SC', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif;
      --font-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    html.dark {
      --bg: #0a0a0a;
      --fg: #fafafa;
      --card: #171717;
      --border: rgba(38 38 38 / 0.55);
      --muted: #a3a3a3;
      --muted-fg: #1a1a1a;
      --shadow-card: 0 8px 30px rgb(0 0 0 / 0.20);
      --shadow-card-hover: 0 12px 40px rgb(0 0 0 / 0.40);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* ============ Header ============ */
    header {
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 72rem; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 1rem;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-badge {
      width: 2rem; height: 2rem; border-radius: 0.75rem;
      background: var(--fg); color: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-title { font-size: 0.875rem; font-weight: 600; letter-spacing: -0.01em; }
    .brand-sub { font-size: 0.6875rem; color: var(--muted); }

    /* ============ Main ============ */
    main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem 1rem;
    }

    .viewer { position: relative; width: 100%; max-width: 48rem; }
    @media (min-width: 1024px) { .viewer { max-width: 64rem; } }

    /* ============ Joke Card ============ */
    .joke-card {
      position: relative; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 360px;
      border-radius: var(--radius-lg);
      background: var(--card);
      box-shadow: var(--shadow-card);
      padding: 2rem;
      cursor: grab;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      animation: fadeIn 0.4s ease;
      overflow: hidden;
    }
    @media (min-width: 768px) {
      .joke-card { min-height: 480px; padding: 3rem; }
    }
    .joke-card:hover { box-shadow: var(--shadow-card-hover); }
    .joke-card:active { cursor: grabbing; }
    .joke-card.dragging { transition: transform 0.2s ease; }

    .quote-deco { position: absolute; opacity: 0.10; }
    html.dark .quote-deco { opacity: 0.20; }
    .quote-deco.tl { top: 2rem; left: 2rem; transform: rotate(180deg); }
    .quote-deco.br { bottom: 2rem; right: 2rem; }

    .joke-text {
      max-width: 90%; text-align: center;
      font-family: var(--font-serif);
      font-size: 1.5rem; font-weight: 300; line-height: 1.65;
      letter-spacing: -0.025em;
      position: relative; z-index: 1;
    }
    @media (min-width: 768px) {
      .joke-text { font-size: 1.875rem; line-height: 1.7; }
    }
    @media (min-width: 1024px) {
      .joke-text { font-size: 2.25rem; line-height: 1.8; }
    }

    .index-container {
      display: flex; align-items: center; gap: 1rem;
      margin-top: 2.5rem; opacity: 0.3;
    }
    .index-line { width: 2rem; height: 1px; background: currentColor; }
    .index-label { font-family: var(--font-mono); font-size: 0.6875rem; letter-spacing: 0.1em; text-transform: uppercase; }

    /* ============ Nav Controls ============ */
    .nav-controls { margin-top: 2.5rem; display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
    .btn-row { display: flex; align-items: center; gap: 1rem; }

    .nav-btn {
      border: none; background: var(--card); border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: var(--shadow-btn);
      transition: all 0.2s ease;
      width: 3.5rem; height: 3.5rem;
      color: var(--fg);
    }
    .nav-btn.lg { width: 4rem; height: 4rem; }
    @media (min-width: 768px) {
      .nav-btn { width: 4rem; height: 4rem; }
      .nav-btn.lg { width: 5rem; height: 5rem; }
    }
    .nav-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgb(0 0 0 / 0.1); }
    .nav-btn:active { transform: scale(0.95) translateY(0); }
    .nav-btn svg { width: 1.5rem; height: 1.5rem; stroke-width: 2.25; }
    @media (min-width: 768px) { .nav-btn svg { width: 1.75rem; height: 1.75rem; } }

    /* ============ Secondary Actions ============ */
    .actions { display: flex; align-items: center; gap: 0.75rem; }
    .action-btn {
      width: 2.75rem; height: 2.75rem;
      border: none; background: transparent; border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--muted);
      transition: color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    }
    .action-btn:hover { transform: scale(1.1); color: var(--fg); background: color-mix(in srgb, var(--fg) 8%, transparent); }
    .action-btn:active { transform: scale(0.9); }
    .action-btn svg { width: 1.35rem; height: 1.35rem; transition: fill 0.3s ease; stroke-width: 2; }
    .action-btn.active.favorite.active { color: var(--accent-red); }
    .action-btn.active.favorite.active svg { fill: currentColor; animation: heartBeat 0.5s ease; }
    .action-btn.autoplay.active { color: var(--accent-blue); }

    /* ============ Theme toggle ============ */
    .theme-toggle {
      width: 2.25rem; height: 2.25rem; border: 1px solid var(--border);
      border-radius: var(--radius-full); background: var(--card); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease; position: relative;
    }
    .theme-toggle:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgb(0 0 0 / 0.08); }
    .theme-toggle svg { width: 1rem; height: 1rem; transition: transform 0.3s ease, opacity 0.3s ease; }
    .theme-toggle .sun { transform: rotate(0); opacity: 1; }
    .theme-toggle .moon { position: absolute; transform: rotate(90deg); opacity: 0; }
    html.dark .theme-toggle .sun { transform: rotate(-90deg); opacity: 0; }
    html.dark .theme-toggle .moon { transform: rotate(0); opacity: 1; }

    /* ============ Toast ============ */
    .toast {
      position: fixed; top: 2rem; left: 50%;
      transform: translate(-50%, -20px) scale(0.95);
      background: var(--accent-green); color: white;
      padding: 0.75rem 1.5rem; border-radius: var(--radius-full);
      font-size: 0.875rem; font-weight: 500;
      box-shadow: var(--shadow-toast-success);
      opacity: 0; transition: transform 0.3s var(--ease), opacity 0.3s ease;
      z-index: 1000; pointer-events: none; display: flex; align-items: center; gap: 0.5rem;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
    .toast.error { background: var(--accent-red); box-shadow: var(--shadow-toast-error); }

    /* ============ Footer ============ */
    footer {
      border-top: 1px solid var(--border);
      padding: 1rem 0; text-align: center;
      font-size: 0.75rem; color: var(--muted);
    }

    /* ============ Animations ============ */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.3); }
      50% { transform: scale(0.95); }
      75% { transform: scale(1.15); }
    }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

    .slide-in-left { animation: slideInLeft 0.4s var(--ease); }
    .slide-in-right { animation: slideInRight 0.4s var(--ease); }
    .scale-in { animation: scaleIn 0.4s var(--ease); }

    /* Accessibility helpers */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
  </style>
</head>

  <script>
    // =============== 真实笑话数据（从 JOKES_DATA_DEDUPED 提取）===============

      "儿子问：爸爸，为什么汽车的速度表上最高能到200公里，但是我们从来没开到过那么快？爸爸说：就像你数学书后面的答案，虽然都有，但你从来没全做对过。",
      "医生问病人：你失眠多久了？病人说：三个晚上了。医生说：那你白天精神怎么样？病人说：白天睡得特别香。",
      "老虎抓住了一只兔子，准备吃了它。兔子说：老虎大哥，你不能吃我，我是一只聪明的兔子，我可以帮你做很多事情。老虎说：你能帮我做什么？兔子说：我可以帮你找食物，帮你放哨，还可以给你讲笑话。老虎说：那你先讲个笑话听听，如果好笑，我就不吃你。兔子说：从前有一只老虎，它抓住了一只兔子，然后让兔子讲笑话，兔子讲了一个笑话，老虎笑了，然后老虎就把兔子放了。老虎说：这不好笑。兔子说：那你等一下，我还有更好笑的。老虎说：不用了，我已经饱了。",
      "大象和蚂蚁结婚了，可是没过多久，大象就死了。蚂蚁非常伤心，它一边哭一边说：亲爱的，你怎么这么早就走了，我下半辈子不用干别的了，就忙着埋你了。",
      "乌龟和兔子比赛跑步，兔子很快就跑到了前面，它回头一看，乌龟还在后面慢慢爬。兔子想：反正乌龟爬得慢，我先睡一会儿。兔子醒来一看，乌龟已经爬到终点了。兔子非常生气，它对乌龟说：你作弊！乌龟说：我没有作弊，是你自己睡着了。兔子说：那我们再比一次。乌龟说：好啊，不过这次得我选路线。乌龟选了一条有很多河的路线，兔子不会游泳，只能看着乌龟慢慢爬过去。",
      "猪对牛说：你每天都要干活，真辛苦。牛说：你每天都不用干活，真舒服。猪说：可是我很快就要被宰了。牛说：可是我能活很久。猪说：那我们换一下吧。牛说：好啊。于是猪开始每天干活，牛开始每天休息。过了一段时间，猪被宰了，牛也因为不干活被宰了。",
      "两个人在聊天，一个人说：我最近在减肥，每天都吃很少。另一个人说：那你瘦了吗？那个人说：瘦了，瘦了一斤。另一个人说：才瘦一斤啊，我瘦了十斤呢。那个人说：那你是怎么瘦的？另一个人说：我把手机里的美颜相机卸载了。"
    ];

    // =============== 状态管理 ===============
    const state = {
      index: Math.floor(Math.random() * JOKES.length),
      favorites: new Set(),
      autoPlay: false,
      autoTimer: null,
      direction: 0, // -1 left, 0 random, 1 right
    };

    // =============== DOM 元素 ===============
    const $ = (id) => document.getElementById(id);
    const jokeTextEl = $('joke-text');
    const jokeIndexEl = $('joke-index');
    const jokeCardEl = $('joke-card');
    const totalCountEl = $('total-count');
    const toastEl = $('toast');
    const toastTextEl = $('toast-text');

    totalCountEl.textContent = JOKES.length;

    // =============== 渲染函数 ===============
    function render(direction = 0) {
      const idx = state.index;
      const total = JOKES.length;
      jokeTextEl.textContent = JOKES[idx];
      jokeIndexEl.textContent = `${String(idx + 1).padStart(3, '0')} / ${String(total).padStart(3, '0')}`;
      // 动画
      jokeCardEl.classList.remove('slide-in-left', 'slide-in-right', 'scale-in');
      // 触发重排以重启动画
      void jokeCardEl.offsetWidth;
      if (direction === -1) jokeCardEl.classList.add('slide-in-right');
      else if (direction === 1) jokeCardEl.classList.add('slide-in-left');
      else jokeCardEl.classList.add('scale-in');
      // 更新收藏按钮状态
      const favBtn = $('btn-favorite');
      if (state.favorites.has(idx)) {
        favBtn.classList.add('active');
      } else {
        favBtn.classList.remove('active');
      }
    }

    // =============== 导航 ===============
    function nextJoke() {
      if (JOKES.length <= 1) return;
      state.direction = 1;
      state.index = (state.index + 1) % JOKES.length;
      render(1);
    }
    function prevJoke() {
      if (JOKES.length <= 1) return;
      state.direction = -1;
      state.index = (state.index - 1 + JOKES.length) % JOKES.length;
      render(-1);
    }
    function randomJoke() {
      if (JOKES.length <= 1) return;
      let nextIdx = state.index;
      while (nextIdx === state.index && JOKES.length > 1) {
        nextIdx = Math.floor(Math.random() * JOKES.length);
      }
      state.index = nextIdx;
      render(0);
    }

    // =============== 收藏 ===============
    function toggleFavorite() {
      const idx = state.index;
      const favBtn = $('btn-favorite');
      if (state.favorites.has(idx)) {
        state.favorites.delete(idx);
        favBtn.classList.remove('active');
        showToast('已取消收藏');
      } else {
        state.favorites.add(idx);
        favBtn.classList.add('active');
        // 心跳动画
        const svg = favBtn.querySelector('svg');
        svg.style.animation = 'heartBeat 0.5s ease';
        setTimeout(() => { svg.style.animation = ''; }, 500);
        showToast('已加入收藏');
      }
    }

    // =============== 复制 ===============
    function copyJoke() {
      const text = JOKES[state.index];
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板')).catch(() => fallbackCopy(text))
        } else {
          fallbackCopy(text);
        }
      } catch (e) {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', '');
        ta.style.position = 'absolute';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('已复制到剪贴板');
      } catch (e) {
        showToast('复制失败，请重试', true);
      }
    }

    // =============== 分享 ===============
    function shareJoke() {
      const text = JOKES[state.index];
      if (navigator.share) {
        navigator.share({ title: 'LaughterBox', text: text, url: window.location.href }).catch(() => {});
      } else {
        copyJoke();
      }
    }

    // =============== 自动播放 ===============
    function toggleAutoPlay() {
      state.autoPlay = !state.autoPlay;
      const btn = $('btn-autoplay');
      const playIcon = btn.querySelector('.play-icon');
      const pauseIcon = btn.querySelector('.pause-icon');
      if (state.autoPlay) {
        btn.classList.add('active');
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'inline-block';
        state.autoTimer = setInterval(nextJoke, 30000);
        showToast('已开启自动播放');
      } else {
        btn.classList.remove('active');
        playIcon.style.display = 'inline-block';
        pauseIcon.style.display = 'none';
        if (state.autoTimer) clearInterval(state.autoTimer);
        state.autoTimer = null;
        showToast('已停止自动播放');
      }
    }

    // =============== Toast 提示 ===============
    let toastTimer = null;
    function showToast(message, isError = false) {
      toastTextEl.textContent = message;
      toastEl.classList.toggle('error', isError);
      toastEl.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2000);
    }

    // =============== 主题切换 ===============
    function toggleTheme() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('laughterbox-theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('laughterbox-theme', 'dark');
      }
    }

    // 初始化主题
    (function initTheme() {
      const saved = localStorage.getItem('laughterbox-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();

    // =============== 拖拽 ===============
    let dragStartX = 0;
    let isDragging = false;
    jokeCardEl.addEventListener('pointerdown', (e) => {
      dragStartX = e.clientX;
      isDragging = true;
      jokeCardEl.classList.add('dragging');
      jokeCardEl.style.cursor = 'grabbing';
      jokeCardEl.setPointerCapture(e.pointerId);
    });
    jokeCardEl.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      jokeCardEl.style.transform = `translateX(${dx * 0.3}px)`;
    });
    jokeCardEl.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX;
      isDragging = false;
      jokeCardEl.classList.remove('dragging');
      jokeCardEl.style.cursor = 'grab';
      jokeCardEl.style.transform = '';
      if (dx < -60) nextJoke();
      else if (dx > 60) prevJoke();
    });

    // =============== 事件绑定 ===============
    $('btn-prev').addEventListener('click', prevJoke);
    $('btn-next').addEventListener('click', nextJoke);
    $('btn-random').addEventListener('click', randomJoke);
    $('btn-favorite').addEventListener('click', toggleFavorite);
    $('btn-copy').addEventListener('click', copyJoke);
    $('btn-share').addEventListener('click', shareJoke);
    $('btn-autoplay').addEventListener('click', toggleAutoPlay);
    $('theme-toggle').addEventListener('click', toggleTheme);

    // =============== 键盘快捷键 ===============
    window.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') { e.preventDefault(); nextJoke(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prevJoke(); }
      else if (e.key === ' ' || e.key.toLowerCase() === 'r') { e.preventDefault(); randomJoke(); }
      else if (e.key.toLowerCase() === 'f') { e.preventDefault(); toggleFavorite(); }
      else if (e.key.toLowerCase() === 'c') { e.preventDefault(); copyJoke(); }
    });

    // =============== 初始化 ===============
    render();

    // 初次加载动画延迟
    setTimeout(() => {
      document.querySelectorAll('[aria-hidden="true"]').forEach(() => {});
    }, 50);
  </script>
</body>
</html>
